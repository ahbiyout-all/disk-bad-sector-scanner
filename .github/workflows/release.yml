name: Automated Release & Cross-Platform Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v4.2.1)'
        required: true
        default: 'v4.2.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package & Publish GitHub Release (Node.js 22 LTS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 (LTS)
        # Note: Node.js 20 is officially deprecated/EOL. Using LTS 22.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Package Official Desktop Installer Asset
        run: node scripts/package-cross-platform.mjs

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION="${{ github.ref_name || github.event.inputs.version_tag }}"
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT
          cat << 'EOF' > RELEASE_NOTES.md
          ## 🚀 DiskSentinel Pro Release

          [제작자 및 공식 채널 안내]
          - 개발자: AhBiYout
          - GitHub 저장소: https://github.com/AhBiYout-all/disk-bad-sector-scanner
          - 공식 구글 블로그: https://ahbiyoutvibe.blogspot.com/
          - 소속: https://www.cisnet.co.kr

          ### 📦 배포 설치 파일 목록 (Release Assets)
          1. **Desktop Setup Installer**: `DiskSentinel-Pro-v4.4.0-Desktop-Setup-Package.zip`
             - Inno Setup 네이티브 인스톨러 컴파일 지원 (`setup.iss`, `build.bat`)
             - Windows 조용한 방화벽 규칙 사전 등록 (기본 이름 및 버전 포함 이름)
             - 무인 설치 지원 (`/SILENT`, `/VERYSILENT /NORESTART`)
             - *(안내: 모바일 APK / iOS 환경은 로우 레벨 디스크 하드웨어 직접 접근이 불가하므로 제외되었습니다.)*

          ### 🛡️ 변경 사항 및 보안
          - Node.js 22 LTS / 24 런타임 적용 완료
          - 실시간 디스크 배드섹터 검출 및 S.M.A.R.T. 분석 기능
          - 오프라인 단독 실행 지원
          EOF

      - name: Publish Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version_tag }}
          name: DiskSentinel Pro ${{ github.ref_name || github.event.inputs.version_tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist-packages/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
