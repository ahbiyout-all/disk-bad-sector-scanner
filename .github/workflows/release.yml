name: Desktop Installer Build & GitHub Release Packaging

on:
  push:
    tags:
      - 'v*'
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v4.5.0)'
        required: true
        default: 'v4.5.0'

permissions:
  contents: write

jobs:
  # 1. Frontend Build Job (Runs on Linux for stability)
  build-frontend:
    name: Build Web Assets (Ubuntu)
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version_info.outputs.tag_name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Determine Version & Generate Release Notes
        id: version_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest-snapshot"
          fi

          if [[ ! "$TAG" =~ ^v ]] && [[ "$TAG" != "latest-snapshot" ]]; then
            TAG="v$TAG"
          fi

          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          
          cat << EOF > RELEASE_NOTES.md
          ## 🚀 DiskSentinel Pro $TAG Release

          [제작자 및 공식 채널 안내]
          - 개발자: AhBiYout
          - GitHub 저장소: https://github.com/AhBiYout-all/disk-bad-sector-scanner
          - 공식 구글 블로그: https://ahbiyoutvibe.blogspot.com/
          - 소속: https://www.cisnet.co.kr

          ### 📦 배포 설치 파일 목록 (Release Assets)
          1. **Inno Setup Installer (.exe)**: \`DiskSentinel_Setup_$TAG.exe\`
             - Windows 표준 설치 프로그램 (방화벽 규칙 자동 등록 지원)
          2. **Desktop Setup Package (.zip)**: \`DiskSentinel-Pro-$TAG-Desktop-Setup-Package.zip\`
             - Inno Setup 스펙 및 빌드 스크립트 포함 원본 패키지
          3. **Cross-Platform PC Portable (.zip)**: \`DiskSentinel-Pro-$TAG-PC-Windows-macOS-Linux.zip\`
             - 무설치 포터블 실행 패키지

          ### 🛡️ 주요 기능 및 업데이트
          - Node.js 22 LTS 런타임 최적화 빌드
          - W3C StorageManager & OPFS Buffer Probe 실측 텔레메트리 연동
          - 실시간 디스크 배드섹터 검출 및 S.M.A.R.T. 정밀 분석
          - 파일/볼륨 직접 마운트 검사 및 비트 카빙 데이터 수복
          EOF
        shell: bash

      - name: Build Web Application
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            dist/
            RELEASE_NOTES.md

  # 2. Desktop Packaging & Release Job (Runs on Windows for Inno Setup)
  release-desktop:
    name: Package & Publish Release (Windows)
    needs: build-frontend
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile Native Components
        run: |
          if (!(Test-Path "bin/native")) { New-Item -Path "bin/native" -ItemType Directory -Force }
          
          echo "--- Compiling C# Launcher ---"
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { throw "csc.exe not found at $csc" }
          & $csc /target:winexe /out:bin\native\DiskSentinelPro.exe src\native\DiskSentinelLauncher.cs
          
          echo "--- Compiling C++ Core Engine (DLL) ---"
          cmd.exe /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cl.exe /LD /O2 /D DISKSENTINEL_EXPORTS src\native\DiskSentinelEngine.cpp /Fe:bin\native\DiskSentinelNativeCore.dll /I src\native"
          
          if (!(Test-Path "bin/native/DiskSentinelPro.exe")) { throw "Launcher build failed" }
          if (!(Test-Path "bin/native/DiskSentinelNativeCore.dll")) { throw "Core engine build failed" }
        shell: pwsh

      - name: Package Desktop Assets (ZIP)
        run: |
          node scripts/package-cross-platform.mjs "${{ needs.build-frontend.outputs.tag_name }}"
        shell: pwsh

      - name: Compile Inno Setup Installer (EXE)
        run: |
          iscc.exe /DAppVersion="${{ needs.build-frontend.outputs.tag_name }}" setup.iss
        shell: pwsh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ needs.build-frontend.outputs.tag_name }}
          name: DiskSentinel Pro ${{ needs.build-frontend.outputs.tag_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist-packages/*.zip
            Output/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
