# =====================================================================
# DiskSentinel Pro - CI/CD Release Automation Pipeline
# GitHub Actions Runner Modern Node.js LTS (v22/v24) Support
# Author: AhBiYout-all
# SPDX-License-Identifier: Apache-2.0
# =====================================================================

name: "Production Build & GitHub Release Packaging"

on:
  push:
    tags:
      - "v*" # Triggers on releases, e.g., v4.3.0, v4.3.1

jobs:
  release_build:
    name: "Cross-Platform Build & Asset Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Node.js LTS (v22 / 24 Compliant)"
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Resolves Node.js 20 Deprecation warning
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: "Install dependencies"
        run: npm install

      - name: "Run Lint Validation"
        run: npm run lint

      - name: "Compile Application Assets"
        run: npm run build

      - name: "Package Official Desktop Installer Asset"
        run: node scripts/package-cross-platform.mjs

      - name: "Create Official GitHub Release & Upload Production Assets"
        uses: softprops/action-gh-release@v2
        with:
          name: "DiskSentinel Pro ${{ github.ref_name }}"
          body: |
            ## 🚀 DiskSentinel Pro ${{ github.ref_name }} Official Release

            [제작자 및 공식 채널 안내]
            - 개발자: AhBiYout
            - GitHub 저장소: https://github.com/AhBiYout-all/disk-bad-sector-scanner
            - 공식 구글 블로그: https://ahbiyoutvibe.blogspot.com/
            - 소속: https://www.cisnet.co.kr

            ### 📦 공식 배포 인스톨러 (Release Asset)
            - **Desktop Setup Installer**: `DiskSentinel-Pro-${{ github.ref_name }}-Desktop-Setup-Package.zip`
              - Windows 자동 Inno Setup 빌드(`build.bat` 및 `setup.iss`) 지원
              - 데스크톱 독립 실행 및 방화벽 규칙 자동 등록 지원
              - *(안내: 모바일 APK / iOS 환경은 로우 레벨 디스크 하드웨어 직접 접근이 불가하므로 제외되었습니다.)*

            ### 📜 상세 변경 내역
            프로젝트 내 `docs/PATCHNOTES.md` 및 `docs/WORKLOG.md`를 참조해 주시기 바랍니다.
          files: |
            dist-packages/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
