name: Tauri Desktop App Build & Release (Windows)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v4.6.0)'
        required: true
        default: 'v4.6.0'
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: tauri-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-tauri-windows:
    name: Build Tauri v2 Desktop App (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend & Tauri CLI Dependencies
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue package-lock.json
          npm install --include=optional
          $verifyScript = @"
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');
          const checks = [
            { optionalPkg: '@rollup/rollup-win32-x64-msvc', parentPkg: 'rollup' },
            { optionalPkg: '@tailwindcss/oxide-win32-x64-msvc', parentPkg: '@tailwindcss/oxide' },
            { optionalPkg: '@tauri-apps/cli-win32-x64-msvc', parentPkg: '@tauri-apps/cli' },
            { optionalPkg: '@esbuild/win32-x64', parentPkg: 'esbuild' }
          ];
          const missing = [];
          for (const c of checks) {
            try {
              require.resolve(c.optionalPkg);
            } catch {
              const parentPkgPath = path.join('node_modules', ...c.parentPkg.split('/'), 'package.json');
              const ver = JSON.parse(fs.readFileSync(parentPkgPath, 'utf8')).version;
              missing.push(c.optionalPkg + '@' + ver);
            }
          }
          if (missing.length > 0) {
            console.log('Installing missing Windows native optional packages:', missing.join(', '));
            execFileSync('npm', ['install', '--no-save', '--include=optional', ...missing], { stdio: 'inherit', shell: true });
          }
          "@
          node -e $verifyScript

      - name: Run TypeScript Type Check
        run: npm run lint

      - name: Build Tauri v2 Desktop Executable & Installers
        run: npm run tauri:build

      - name: Resolve Release Tag & Notes
        id: version_info
        shell: pwsh
        run: |
          $pkgVer = node -p "require('./package.json').version"
          $eventName = "${{ github.event_name }}"
          $inputTag = "${{ inputs.version_tag }}"
          $ref = "${{ github.ref }}"
          $refName = "${{ github.ref_name }}"

          if ($eventName -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace($inputTag)) {
            $tag = $inputTag.Trim()
          } elseif ($ref.StartsWith("refs/tags/")) {
            $tag = $refName.Trim()
          } else {
            $tag = "v$pkgVer"
          }

          if (-not $tag.StartsWith("v")) {
            $tag = "v$tag"
          }

          $notes = @"
          ## Disk Bad Sector Scanner $tag (Tauri v2 Desktop App)

          - **Executable**: ``DiskBadSectorScanner.exe`` (Tauri v2 + Rust Direct Win32 I/O Core)
          - **NSIS Installer**: ``DiskBadSectorScanner_*_x64-setup.exe``
          - **MSI Installer**: ``DiskBadSectorScanner_*_x64_en-US.msi``

          > GitHub Releases publishes Tauri v2 desktop builds only.
          "@
          $notes | Out-File -FilePath "RELEASE_NOTES.md" -Encoding utf8

          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Tauri Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: disk-bad-sector-scanner-tauri-windows
          retention-days: 30
          path: |
            src-tauri/target/release/DiskBadSectorScanner.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish Tauri Desktop App Only to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version_info.outputs.tag_name }}"
          $exePath = "src-tauri/target/release/DiskBadSectorScanner.exe"
          if (!(Test-Path $exePath)) {
            throw "Expected Tauri executable not found: $exePath"
          }

          $assets = @($exePath)
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          foreach ($f in $nsis) { $assets += $f.FullName }
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          foreach ($f in $msi) { $assets += $f.FullName }

          $releaseJson = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Disk Bad Sector Scanner $tag" --notes-file RELEASE_NOTES.md --latest *> $null
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 3
            }
          } else {
            gh release edit $tag --title "Disk Bad Sector Scanner $tag" --notes-file RELEASE_NOTES.md --latest *> $null
            try {
              $existing = ($releaseJson | ConvertFrom-Json).assets
              foreach ($a in $existing) {
                if ($a.name -like "DiskBadSectorScanner_Setup_*.exe") {
                  gh release delete-asset $tag $a.name --yes *> $null
                }
              }
            } catch {
              Write-Host "Skipping legacy asset cleanup check"
            }
          }

          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) {
            Start-Sleep -Seconds 3
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload Tauri release assets to GitHub tag $tag"
            }
          }
