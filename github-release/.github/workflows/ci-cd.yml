# =====================================================================
# DiskSentinel Pro - CI/CD Release Automation Pipeline
# GitHub Actions Runner Modern Node.js LTS (v22/v24) Support
# Author: AhBiYout-all
# SPDX-License-Identifier: Apache-2.0
# =====================================================================

name: "Production Build & GitHub Release Packaging"

on:
  push:
    tags:
      - "v*" # Triggers on releases, e.g., v4.3.0, v4.3.1

jobs:
  release_build:
    name: "Cross-Platform Build & Asset Release"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Node.js LTS (v22 / 24 Compliant)"
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Resolves Node.js 20 Deprecation warning
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Run Lint Validation"
        run: npm run lint

      - name: "Compile Application Assets"
        run: npm run build

      - name: "Package Cross-Platform Release Assets (PC / APK / iOS)"
        run: |
          mkdir -p build_packages
          
          # 1. PC Package Compilation (Windows/Mac/Linux index package)
          zip -r "build_packages/DiskSentinel-Pro-${{ github.ref_name }}-PC-Windows-macOS-Linux.zip" dist/
          
          # 2. Android Mobile Web PWA/APK wrapper template
          cp -r dist/ dist-android/
          zip -r "build_packages/DiskSentinel-Pro-${{ github.ref_name }}-Android.apk.zip" dist-android/
          
          # 3. iOS WebBundle container package
          cp -r dist/ dist-ios/
          zip -r "build_packages/DiskSentinel-Pro-${{ github.ref_name }}-iOS-WebBundle.zip" dist-ios/
          
          # 4. Universal installer bundle
          tar -czf "build_packages/DiskSentinel-Pro-${{ github.ref_name }}-Universal-WebInstaller.tar.gz" dist/

      - name: "Create Official GitHub Release & Upload Production Assets"
        uses: softprops/action-gh-release@v2
        with:
          name: "DiskSentinel Pro ${{ github.ref_name }}"
          body: |
            ## 🚀 DiskSentinel Pro ${{ github.ref_name }} Production Release
            
            This release is automatically built and compiled by the CI/CD pipeline using Node.js 22 LTS.
            
            ### 📦 Released Assets (크로스 플랫폼 설치 파일)
            - **PC Client (Windows/Mac/Linux)**: Bundle files of HTML, JS, CSS. Unpack and launch `index.html`.
            - **Android (APK/PWA)**: Mobile optimised PWA/APK deployment archive.
            - **iOS WebBundle**: Apple Safari ホーム 화면 바로가기 패키지.
            - **Universal WebInstaller**: Universal bundle for deployment across any server configurations.
            
            ### 📜 Changelog
            Please refer to the `docs/PATCHNOTES.md` file in the repository for detailed change histories.
          files: |
            build_packages/DiskSentinel-Pro-${{ github.ref_name }}-PC-Windows-macOS-Linux.zip
            build_packages/DiskSentinel-Pro-${{ github.ref_name }}-Android.apk.zip
            build_packages/DiskSentinel-Pro-${{ github.ref_name }}-iOS-WebBundle.zip
            build_packages/DiskSentinel-Pro-${{ github.ref_name }}-Universal-WebInstaller.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
